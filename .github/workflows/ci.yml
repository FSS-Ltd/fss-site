name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancellation during a main-branch migration could leave only part of a
  # reviewed migration batch applied. Feature branch validation can still be
  # superseded safely.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    # The Operations, Growth, and full visual suites run serially. Allow the
    # visual regression check to complete after the data-backed suites rather
    # than cancelling the validation job before it can upload failures.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fss_growth_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fss_growth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fss_growth_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fss_growth_test
      OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fss_growth_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-24-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-24-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check migration policy
        run: pnpm verify:migrations

      - name: Run type check
        run: pnpm typecheck

      - name: Prepare Growth OS integration database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d fss_growth_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            create role anon nologin;
          exception when duplicate_object then null;
          end $$;
          do $$ begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end $$;
          do $$ begin
            create role service_role nologin;
          exception when duplicate_object then null;
          end $$;
          SQL
          for migration in supabase/migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER_ID" \
              psql -U postgres -d fss_growth_test -v ON_ERROR_STOP=1 \
              < "$migration"
          done

      - name: Run Operations tests with coverage
        run: pnpm test:coverage:operations

      - name: Run Growth OS tests with coverage
        run: pnpm test:coverage:growth

      - name: Validate public redesign shell
        run: pnpm test:public-redesign

      - name: Run FSS Studio visual comparisons
        run: pnpm test:visual

      - name: Run lint
        run: pnpm lint

      - name: Run production build
        run: pnpm build

      - name: Check homepage bundle budget
        run: pnpm perf:budget:homepage

      - name: Upload FSS Studio visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fss-studio-visual-artifacts
          path: output/playwright
          if-no-files-found: ignore

  migrate-production:
    name: Apply production migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gfeyanrriryihpcgdvqi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Check migration credentials
        shell: bash
        run: |
          missing=0
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Migration credential missing::${secret_name} must be configured in the GitHub production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Link the approved production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show reviewed migration plan
        run: supabase db push --linked --dry-run

      - name: Apply reviewed forward migrations
        run: supabase db push --linked
