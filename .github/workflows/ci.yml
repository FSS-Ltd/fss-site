name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fss_growth_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fss_growth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fss_growth_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fss_growth_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration policy
        run: pnpm verify:migrations

      - name: Run type check
        run: pnpm typecheck

      - name: Prepare Growth OS integration database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d fss_growth_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            create role anon nologin;
          exception when duplicate_object then null;
          end $$;
          do $$ begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end $$;
          do $$ begin
            create role service_role nologin;
          exception when duplicate_object then null;
          end $$;
          SQL
          for migration in supabase/migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER_ID" \
              psql -U postgres -d fss_growth_test -v ON_ERROR_STOP=1 \
              < "$migration"
          done

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration:growth:database:ci

      - name: Validate redesign shell
        run: pnpm test:redesign

      - name: Run lint
        run: pnpm lint

      - name: Run production build
        run: pnpm build

      - name: Check homepage bundle budget
        run: pnpm perf:budget:homepage
