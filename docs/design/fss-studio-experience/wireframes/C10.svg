<text x="304" y="584" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600" fill="#0f7078">What happens next</text>
<text x="304" y="613" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">FSS will assess your feedback and confirm whether it is included in the agreed revision scope. No additional charge is created by this feedback.</text>
