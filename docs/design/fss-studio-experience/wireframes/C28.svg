<text x="280" y="152" font-family="Geist,Arial,sans-serif" font-size="36" font-weight="600" fill="#0a1a2e">Let’s plan the kickoff</text>
<text x="280" y="192" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="400" fill="#46566c">Getting started · Meet your delivery lead</text>
<rect x="280" y="223" width="1112" height="231" rx="16" fill="#07182e" stroke="#d9dfe5"/>
<text x="304" y="258" font-family="Geist,Arial,sans-serif" font-size="11" font-weight="500" fill="#ffffff">YOUR NEXT STEP</text>
<text x="304" y="309" font-family="Geist,Arial,sans-serif" font-size="30" font-weight="600" fill="#ffffff">A clear start, together.</text>
<text x="304" y="355" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="400" fill="#ffffff">A 30-minute session to confirm priorities, dependencies and what success looks like. Your delivery lead is Jean-Fidele.</text>
<rect x="304" y="386" width="139" height="44" rx="12" fill="#ffffff" stroke="#788696"/>
<text x="324" y="412" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="500" fill="#0a1a2e">Choose a time</text>
<a href="../wireframes.html#C28" target="_top" aria-label="Choose a time"><rect x="304" y="386" width="139" height="44" fill="transparent"/></a>
<rect x="280" y="478" width="1112" height="322" rx="16" fill="#ffffff" stroke="#d9dfe5"/>
<text x="304" y="522" font-family="Geist,Arial,sans-serif" font-size="20" font-weight="600" fill="#0a1a2e">Before we meet</text>
<text x="304" y="567" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="500" fill="#0a1a2e">Your goals</text>
<text x="304" y="594" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">Bring your top three outcomes and any fixed deadlines.</text>
<text x="304" y="642" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="500" fill="#0a1a2e">The right people</text>
<text x="304" y="669" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">Invite anyone responsible for content, decisions or access.</text>
<text x="304" y="717" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="500" fill="#0a1a2e">Booking status</text>
<text x="304" y="744" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">No confirmed time yet. We will show it here once the booking is verified.</text>
<rect x="280" y="824" width="1112" height="99" rx="16" fill="#e3f2f1" stroke="#d9dfe5"/>
<text x="304" y="864" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600" fill="#0f7078">Times shown in Europe/London</text>
<text x="304" y="893" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">The booking service shows available times. Opening the calendar does not mark this task complete.</text>
<text x="280" y="959" font-family="Geist,Arial,sans-serif" font-size="12" font-weight="400" fill="#46566c">Faithful Software Solutions · Built on trust. Delivered with care.</text>
