<rect x="304" y="738" width="1064" height="48" rx="8" fill="#ffffff" stroke="#788696"/>
<text x="316" y="766" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="400" fill="#46566c">A customer can book, receive confirmation and find support details.</text>
<text x="304" y="824" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="500" fill="#0a1a2e">Responsibilities &amp; support</text>
<rect x="304" y="838" width="1064" height="48" rx="8" fill="#ffffff" stroke="#788696"/>
<text x="316" y="866" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="400" fill="#46566c">Client supplies final copy and brand assets. Support follows the agreed term.</text>
