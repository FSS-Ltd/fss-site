<rect x="304" y="538" width="1064" height="48" rx="8" fill="#ffffff" stroke="#788696"/>
<text x="316" y="566" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="400" fill="#46566c">Five content pages, booking workflow and confirmation email.</text>
<text x="304" y="624" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="500" fill="#0a1a2e">Not included</text>
