<text x="40" y="659" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">Bookings now display Europe/London time.</text>
<text x="40" y="707" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="500" fill="#0a1a2e">Clearer appointment details</text>
<text x="40" y="734" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">The confirmation includes the address, date</text>
<text x="40" y="754" font-family="Geist,Arial,sans-serif" font-size="14" font-weight="400" fill="#46566c">and booking reference.</text>
<rect x="20" y="830" width="350" height="131" rx="16" fill="#e3f2f1" stroke="#d9dfe5"/>
