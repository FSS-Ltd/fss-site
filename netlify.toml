[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  NEXT_PUBLIC_LEAD_SUBMISSION_PROVIDER = "api"

[context.deploy-preview.environment]
  NEXT_PUBLIC_LEAD_SUBMISSION_PROVIDER = "api"

[context.branch-deploy.environment]
  NEXT_PUBLIC_LEAD_SUBMISSION_PROVIDER = "api"
