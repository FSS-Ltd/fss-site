<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms Registration</title>
  </head>
  <body>
    <form name="fss-lead-capture" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="fss-lead-capture" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="workEmail" />
      <input type="text" name="company" />
      <textarea name="challenge"></textarea>
      <input type="text" name="sourceContext" />
      <input type="text" name="sourcePath" />
      <input type="text" name="resourceSlug" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
