<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" fill="none">
  <rect width="900" height="540" fill="#0d1424"/>

  <!-- Background grid lines -->
  <line x1="0" y1="108" x2="900" y2="108" stroke="#1a2540" stroke-width="1"/>
  <line x1="0" y1="216" x2="900" y2="216" stroke="#1a2540" stroke-width="1"/>
  <line x1="0" y1="324" x2="900" y2="324" stroke="#1a2540" stroke-width="1"/>
  <line x1="0" y1="432" x2="900" y2="432" stroke="#1a2540" stroke-width="1"/>
  <line x1="180" y1="0" x2="180" y2="540" stroke="#1a2540" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="540" stroke="#1a2540" stroke-width="1"/>
  <line x1="540" y1="0" x2="540" y2="540" stroke="#1a2540" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="540" stroke="#1a2540" stroke-width="1"/>

  <!-- Glow orb top right -->
  <radialGradient id="glow1" cx="75%" cy="20%" r="40%">
    <stop offset="0%" stop-color="#6fd4ee" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#6fd4ee" stop-opacity="0"/>
  </radialGradient>
  <rect width="900" height="540" fill="url(#glow1)"/>

  <!-- Code block visual - left side -->
  <rect x="60" y="140" width="380" height="260" rx="12" fill="#131d33" stroke="#1e2f4d" stroke-width="1.5"/>
  <!-- Code line decorations -->
  <rect x="84" y="168" width="60" height="8" rx="4" fill="#6fd4ee" opacity="0.9"/>
  <rect x="84" y="188" width="180" height="7" rx="3.5" fill="#3a5080" opacity="0.7"/>
  <rect x="84" y="205" width="140" height="7" rx="3.5" fill="#3a5080" opacity="0.5"/>
  <rect x="100" y="224" width="200" height="7" rx="3.5" fill="#3a5080" opacity="0.4"/>
  <rect x="100" y="241" width="160" height="7" rx="3.5" fill="#3a5080" opacity="0.4"/>
  <rect x="100" y="258" width="220" height="7" rx="3.5" fill="#3a5080" opacity="0.4"/>
  <rect x="84" y="277" width="90" height="7" rx="3.5" fill="#3a5080" opacity="0.5"/>
  <rect x="100" y="294" width="170" height="7" rx="3.5" fill="#6fd4ee" opacity="0.25"/>
  <rect x="100" y="311" width="130" height="7" rx="3.5" fill="#3a5080" opacity="0.4"/>
  <rect x="84" y="330" width="60" height="8" rx="4" fill="#6fd4ee" opacity="0.5"/>
  <rect x="84" y="350" width="110" height="7" rx="3.5" fill="#3a5080" opacity="0.3"/>
  <rect x="84" y="367" width="80" height="7" rx="3.5" fill="#3a5080" opacity="0.3"/>

  <!-- Connection line from code block to nodes -->
  <line x1="440" y1="270" x2="520" y2="270" stroke="#6fd4ee" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Node graph right side -->
  <!-- Central node -->
  <circle cx="590" cy="270" r="28" fill="#131d33" stroke="#6fd4ee" stroke-width="2"/>
  <text x="590" y="275" text-anchor="middle" font-family="monospace" font-size="11" fill="#6fd4ee" font-weight="bold">SDK</text>

  <!-- Satellite nodes -->
  <circle cx="690" cy="190" r="20" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="690" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aa8d8">API</text>

  <circle cx="720" cy="290" r="20" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="720" y="295" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aa8d8">AUTH</text>

  <circle cx="680" cy="370" r="20" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="680" y="375" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aa8d8">LOG</text>

  <circle cx="510" cy="190" r="18" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="510" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aa8d8">UI</text>

  <circle cx="500" cy="360" r="18" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="500" y="365" text-anchor="middle" font-family="monospace" font-size="9" fill="#7aa8d8">DB</text>

  <!-- Connection lines between nodes -->
  <line x1="590" y1="242" x2="510" y2="208" stroke="#3a6ea8" stroke-width="1.2" opacity="0.7"/>
  <line x1="618" y1="248" x2="670" y2="210" stroke="#3a6ea8" stroke-width="1.2" opacity="0.7"/>
  <line x1="618" y1="278" x2="700" y2="290" stroke="#3a6ea8" stroke-width="1.2" opacity="0.7"/>
  <line x1="608" y1="295" x2="668" y2="352" stroke="#3a6ea8" stroke-width="1.2" opacity="0.7"/>
  <line x1="562" y1="290" x2="518" y2="350" stroke="#3a6ea8" stroke-width="1.2" opacity="0.7"/>

  <!-- Bottom bar -->
  <rect x="0" y="480" width="900" height="60" fill="#0a1020" opacity="0.8"/>
  <rect x="0" y="480" width="900" height="1" fill="#1e2f4d"/>

  <!-- Category tag -->
  <rect x="60" y="496" width="120" height="24" rx="12" fill="#6fd4ee" opacity="0.12"/>
  <text x="120" y="513" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6fd4ee" font-weight="bold" letter-spacing="1">IMPLEMENTATION</text>

  <!-- Title text -->
  <text x="60" y="72" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">SDK Integration Playbook</text>
  <text x="60" y="104" font-family="sans-serif" font-size="16" fill="#7a98c0">For Product Teams</text>
</svg>
