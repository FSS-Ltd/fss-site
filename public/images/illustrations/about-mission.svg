<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f1a2e"/>

  <!-- Background radial glow -->
  <radialGradient id="abg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#6fd4ee" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#6fd4ee" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#abg)"/>

  <!-- Outer ring -->
  <circle cx="400" cy="225" r="160" stroke="#1e3050" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Middle ring -->
  <circle cx="400" cy="225" r="110" stroke="#1e3050" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- Inner ring -->
  <circle cx="400" cy="225" r="62" stroke="#6fd4ee" stroke-width="1.5" opacity="0.3"/>

  <!-- Center circle - FSS core -->
  <circle cx="400" cy="225" r="46" fill="#131d33" stroke="#6fd4ee" stroke-width="2" opacity="0.9"/>
  <text x="400" y="219" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6fd4ee" font-weight="bold">FSS</text>
  <text x="400" y="235" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4a6890">2025</text>

  <!-- Satellite modules -->
  <!-- Enterprise -->
  <circle cx="400" cy="115" r="32" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="400" y="111" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7aa8d8" font-weight="bold">Enterprise</text>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a5080">ERP / CRM</text>

  <!-- Education -->
  <circle cx="560" cy="225" r="32" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="560" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7aa8d8" font-weight="bold">Education</text>
  <text x="560" y="235" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a5080">LMS</text>

  <!-- Community -->
  <circle cx="400" cy="335" r="32" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="400" y="331" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7aa8d8" font-weight="bold">Community</text>
  <text x="400" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a5080">Church / NGO</text>

  <!-- Custom -->
  <circle cx="240" cy="225" r="32" fill="#131d33" stroke="#3a6ea8" stroke-width="1.5"/>
  <text x="240" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7aa8d8" font-weight="bold">Custom</text>
  <text x="240" y="235" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a5080">Bespoke</text>

  <!-- Connection lines from center to satellites -->
  <line x1="400" y1="179" x2="400" y2="147" stroke="#6fd4ee" stroke-width="1" opacity="0.4"/>
  <line x1="446" y1="209" x2="528" y2="211" stroke="#6fd4ee" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="271" x2="400" y2="303" stroke="#6fd4ee" stroke-width="1" opacity="0.4"/>
  <line x1="354" y1="209" x2="272" y2="211" stroke="#6fd4ee" stroke-width="1" opacity="0.4"/>

  <!-- Corner decorations -->
  <rect x="30" y="30" width="40" height="3" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="30" y="30" width="3" height="40" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="730" y="30" width="40" height="3" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="767" y="30" width="3" height="40" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="30" y="417" width="40" height="3" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="30" y="380" width="3" height="40" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="730" y="417" width="40" height="3" rx="1.5" fill="#6fd4ee" opacity="0.3"/>
  <rect x="767" y="380" width="3" height="40" rx="1.5" fill="#6fd4ee" opacity="0.3"/>

  <!-- Bottom label -->
  <text x="400" y="428" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a3e5a" letter-spacing="3">FAITHFUL SOFTWARE SOLUTIONS</text>
</svg>
