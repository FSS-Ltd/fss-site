<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0c1628"/>

  <!-- Background glow top-right -->
  <radialGradient id="shg" cx="80%" cy="20%" r="50%">
    <stop offset="0%" stop-color="#6fd4ee" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#6fd4ee" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#shg)"/>

  <!-- Isometric building blocks suggesting architectural precision -->

  <!-- Block 1 - large base -->
  <!-- Top face -->
  <polygon points="280,200 400,140 520,200 400,260" fill="#1a2e4a" stroke="#6fd4ee" stroke-width="1.2" opacity="0.9"/>
  <!-- Left face -->
  <polygon points="280,200 280,280 400,340 400,260" fill="#131d33" stroke="#1e3050" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="520,200 520,280 400,340 400,260" fill="#0f1a2e" stroke="#1e3050" stroke-width="1"/>

  <!-- Block 2 - on top left -->
  <polygon points="280,140 340,110 400,140 340,170" fill="#1e3355" stroke="#6fd4ee" stroke-width="1" opacity="0.8"/>
  <polygon points="280,140 280,200 340,230 340,170" fill="#131d33" stroke="#1e3050" stroke-width="1"/>
  <polygon points="400,140 400,200 340,230 340,170" fill="#0f1a2e" stroke="#1e3050" stroke-width="1"/>

  <!-- Block 3 - on top right -->
  <polygon points="400,140 460,110 520,140 460,170" fill="#1e3355" stroke="#6fd4ee" stroke-width="1" opacity="0.8"/>
  <polygon points="400,140 400,200 460,230 460,170" fill="#131d33" stroke="#1e3050" stroke-width="1"/>
  <polygon points="520,140 520,200 460,230 460,170" fill="#0f1a2e" stroke="#1e3050" stroke-width="1"/>

  <!-- Block 4 - small top center -->
  <polygon points="340,110 400,80 460,110 400,140" fill="#264266" stroke="#6fd4ee" stroke-width="1.5" opacity="0.9"/>
  <polygon points="340,110 340,170 400,200 400,140" fill="#1a2e4a" stroke="#1e3050" stroke-width="1"/>
  <polygon points="460,110 460,170 400,200 400,140" fill="#131d33" stroke="#1e3050" stroke-width="1"/>

  <!-- Highlight edges on top faces -->
  <line x1="400" y1="80" x2="340" y2="110" stroke="#6fd4ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="80" x2="460" y2="110" stroke="#6fd4ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="140" x2="400" y2="80" stroke="#6fd4ee" stroke-width="0.8" opacity="0.2"/>

  <!-- Glowing dot at top apex -->
  <circle cx="400" cy="80" r="6" fill="#6fd4ee" opacity="0.8"/>
  <circle cx="400" cy="80" r="12" fill="#6fd4ee" opacity="0.15"/>

  <!-- Precision cross-hairs -->
  <line x1="400" y1="30" x2="400" y2="60" stroke="#6fd4ee" stroke-width="1" opacity="0.3"/>
  <line x1="370" y1="80" x2="390" y2="80" stroke="#6fd4ee" stroke-width="1" opacity="0.3"/>
  <line x1="410" y1="80" x2="430" y2="80" stroke="#6fd4ee" stroke-width="1" opacity="0.3"/>

  <!-- Base grid beneath structure -->
  <line x1="200" y1="340" x2="600" y2="340" stroke="#1a2540" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="160" y1="360" x2="640" y2="360" stroke="#1a2540" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Side annotations -->
  <line x1="100" y1="140" x2="275" y2="198" stroke="#6fd4ee" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.3"/>
  <text x="90" y="135" font-family="monospace" font-size="10" fill="#3a6ea8" text-anchor="end">LAYER 3</text>

  <line x1="100" y1="200" x2="278" y2="278" stroke="#6fd4ee" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.3"/>
  <text x="90" y="196" font-family="monospace" font-size="10" fill="#3a6ea8" text-anchor="end">LAYER 2</text>

  <line x1="100" y1="280" x2="278" y2="340" stroke="#6fd4ee" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.3"/>
  <text x="90" y="276" font-family="monospace" font-size="10" fill="#3a6ea8" text-anchor="end">LAYER 1</text>

  <!-- Bottom label -->
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a3e5a" letter-spacing="3">ARCHITECTURAL PRECISION</text>
</svg>
